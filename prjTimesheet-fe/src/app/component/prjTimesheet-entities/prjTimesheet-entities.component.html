
<div class="intestazione">
  <h1></h1>
</div>
<button mat-stroked-button (click)="openDialogProject()">Add Project</button>
<button mat-stroked-button (click)="openDialogTime()">Add Time Spent</button>
<button mat-stroked-button (click)="openDialogData()">Project Data</button>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> Id. </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Project Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

   <!-- Resource Name Column -->
   <ng-container matColumnDef="resourceName">
    <th mat-header-cell *matHeaderCellDef> Resource Name </th>
    <td mat-cell *matCellDef="let element"> {{element.resourceName}} </td>
  </ng-container>

  <!-- Resource Surname Column -->
  <ng-container matColumnDef="resourceSurname">
    <th mat-header-cell *matHeaderCellDef> Resource Surname </th>
    <td mat-cell *matCellDef="let element"> {{element.resourceSurname}} </td>
  </ng-container>

 <!-- Hours Column -->
 <ng-container matColumnDef="hours">
  <th mat-header-cell *matHeaderCellDef> Hours </th>
  <td mat-cell *matCellDef="let element"> {{element.hours}} </td>
</ng-container>

<!-- Phase Column -->
<ng-container matColumnDef="phase">
  <th mat-header-cell *matHeaderCellDef> Phase </th>
  <td mat-cell *matCellDef="let element"> {{element.phase}} </td>
</ng-container>

<!-- Data & Time -->
<ng-container matColumnDef="dataAndTime">
  <th mat-header-cell *matHeaderCellDef> Data&Time </th>
  <td mat-cell *matCellDef="let element"> {{element.dataAndTime}} </td>
</ng-container>

  <!-- Action Column -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Action </th>
    <td mat-cell *matCellDef="let element"><button mat-stroked-button (click)="deleteItem(element.id)">Delete</button></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
