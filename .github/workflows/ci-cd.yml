 
name: PRJTIMESHEET - CI/CD Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------
  # TEST E BUILD BACKEND
  # ---------------------------------------
  backend-test:
    name: Backend - Test e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build e test Spring Boot
        working-directory: ./prjTimesheet-be
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar --no-daemon

  # ---------------------------------------
  # TEST E BUILD FRONTEND
  # ---------------------------------------
  frontend-test:
    name: Frontend - Test e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./prjTimesheet-fe/package-lock.json

      - name: Install dependencies
        working-directory: ./prjTimesheet-fe
        run: npm ci

      - name: Build Angular
        working-directory: ./prjTimesheet-fe
        run: npm run build -- --configuration production

  # ---------------------------------------
  # BUILD E PUBBLICAZIONE DOCKER HUB
  # ---------------------------------------
  docker-publish:
    name: Docker - Build e Push
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    # Pubblica solo su push main o avvio manuale,
    # mai durante una pull request.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -----------------------------------
      # BACKEND IMAGE
      # -----------------------------------
      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/prjtimesheet-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./prjTimesheet-be
          file: ./prjTimesheet-be/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # -----------------------------------
      # FRONTEND IMAGE
      # -----------------------------------
      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/prjtimesheet-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./prjTimesheet-fe
          file: ./prjTimesheet-fe/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publication completed
        run: echo "Immagini pubblicate correttamente su Docker Hub"
